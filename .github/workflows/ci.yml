name: CI

on:
  push:
  pull_request:

jobs:
  check:
    # Run on all three platforms so Windows- or macOS-only breakage shows up
    # even though day-to-day development happens on Linux.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      # These jobs don't launch the app, so skip the ~100 MB Electron download.
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
