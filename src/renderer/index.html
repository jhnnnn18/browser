<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Site icons are the only remote content the UI loads. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https: http:"
    />
    <title>Browser</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header id="tabstrip">
      <div id="tabs" role="tablist" aria-label="Tabs"></div>
      <button id="new-tab" type="button" title="New tab" aria-label="New tab">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 3v10M3 8h10" /></svg>
      </button>
    </header>
    <div id="addressbar">
      <div id="field">
        <input
          id="address"
          type="text"
          placeholder="Search or enter address"
          spellcheck="false"
          autocomplete="off"
          aria-label="Search or enter address"
        />
        <button id="zoom" type="button" title="Reset zoom" hidden></button>
        <div id="progress" aria-hidden="true"></div>
      </div>
      <!-- Replaces the address field while finding in the page. -->
      <div id="findbar" role="search" hidden>
        <input
          id="find"
          type="text"
          placeholder="Find in page"
          spellcheck="false"
          autocomplete="off"
          aria-label="Find in page"
        />
        <span id="find-count" aria-live="polite"></span>
        <button id="find-previous" type="button" title="Previous match" aria-label="Previous match">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 10l4-4 4 4" /></svg>
        </button>
        <button id="find-next" type="button" title="Next match" aria-label="Next match">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 6l4 4 4-4" /></svg>
        </button>
        <button id="find-close" type="button" title="Close (Esc)" aria-label="Close find">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4.5 4.5l7 7M11.5 4.5l-7 7" /></svg>
        </button>
      </div>
    </div>
    <!-- Empty: the active tab's page is drawn on top of this area. -->
    <main id="page-area"></main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
